<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="StackStreak mark">
  <defs>
    <linearGradient id="ss-grad" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF8A5C"/>
      <stop offset="1" stop-color="#FC6432"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#15131F"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" stroke="#FC6432" stroke-opacity="0.35"/>
  <!-- lightning streak built from two offset blades -->
